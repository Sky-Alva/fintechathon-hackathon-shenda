services:
  bank:
    build:
      context: ./bank
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.12-slim}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    ports:
      - "8000:8000"
    environment:
      # Guards /admin (reset, Bank clock, audit). Override in .env for anything shared.
      BANK_ADMIN_KEY: ${BANK_ADMIN_KEY:-demo-admin-key}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/clock')"]
      interval: 5s
      timeout: 3s
      retries: 10

  agent:
    build:
      context: ./agent
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.12-slim}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    ports:
      - "8001:8001"
    # Model settings and API keys (see .env.example). Never the Bank's admin key: the
    # Agent is an untrusted caller (ADR-0001).
    env_file:
      - path: .env
        required: false
    environment:
      BANK_URL: http://bank:8000
      BANK_ADMIN_KEY: ""
      # Guards the Agent's own staff views (/staff). Not the Bank's admin key.
      AGENT_STAFF_KEY: ${AGENT_STAFF_KEY:-demo-staff-key}
    depends_on:
      bank:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build:
      context: ./web
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:22-alpine}
        NGINX_IMAGE: ${NGINX_IMAGE:-nginx:1.27-alpine}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
    ports:
      - "8080:80"
    depends_on:
      agent:
        condition: service_healthy
