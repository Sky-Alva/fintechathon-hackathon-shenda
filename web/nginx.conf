# The web Channel: static files, plus the Bank under /bank/ and the Agent under /agent/
# on the same origin. The Channel logs in with the Bank itself, so the Agent never sees
# the password or the phone token.
server {
    listen 80;
    root /usr/share/nginx/html;

    location /bank/ {
        proxy_pass http://bank:8000/;
    }

    location /agent/ {
        proxy_pass http://agent:8001/;
        # A turn's events stream as NDJSON: pass each line on as it arrives. Over HTTP/1.1
        # (chunked), a turn the Agent breaks off reaches the Channel as an error, not as an
        # empty turn that ended normally.
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    location / {
        try_files $uri /index.html;
    }
}
